name: Gradle

on:
  push:
    branches: [ "develop" ]
    paths:
      - 'src/**'
      - 'gradle/**'
      - 'build.gradle.kts'

  pull_request:
    branches: [ "develop" ]
    paths:
      - 'src/**'
      - 'gradle/**'
      - 'build.gradle.kts'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Build Gradle Wrapper
        run: ./gradlew build

