name: Gradle

on:
  push:
    branches: [ "develop" ]
    paths:
      - 'src/**'
      - 'gradle/**'
      - 'build.gradle.kts'

  pull_request:
    branches: [ "develop" ]
    paths:
      - 'src/**'
      - 'gradle/**'
      - 'build.gradle.kts'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build Gradle Wrapper
        run: ./gradlew build

