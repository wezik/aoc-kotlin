name: Gradle

on:
  push:
    branches: [ "develop" ]
    paths:
      - 'src/**'
      - 'gradle/**'
      - 'build.gradle.kts'

  pull_request:
    branches: [ "develop" ]
    paths:
      - 'src/**'
      - 'gradle/**'
      - 'build.gradle.kts'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build Gradle Wrapper
        run: ./gradlew build

